<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>推し活まとめ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="推し活まとめ">
<meta name="theme-color" content="#f3f3f6">
<style>
:root{
  --bg:#f3f3f6; --card:#ffffff; --ink:#20202a; --sub:#75757f; --line:#e5e5ec;
  --indigo:#2f3a63; --indigo-soft:#edf0f7; --indigo2:#465288;
  --shu:#c9394a; --shu-soft:#fbeef0;
  --amber:#a8761c; --amber-soft:#faf3e2;
  --blue:#3d6ba8; --blue-soft:#e9f0f8;
  --green:#3d7a55; --green-soft:#e9f4ee;
  --gray-soft:#ededf1;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between}
header h1{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.35em;color:var(--indigo)}
#countdown{font-size:11.5px;color:var(--sub);text-align:right;line-height:1.35}
#countdown .num{font-family:var(--serif);font-size:17px;color:var(--shu);font-weight:700;
  font-variant-numeric:tabular-nums}

/* ---------- tabs / nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;padding:8px 0 6px;color:var(--sub);font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:2px;letter-spacing:.05em}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--indigo);font-weight:700}
nav button:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px;border-radius:8px}

main{max-width:640px;margin:0 auto;padding:14px 14px 8px}
.tab{display:none}
.tab.on{display:block}

/* ---------- section head / segmented ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 10px}
.sec-head h2{font-family:var(--serif);font-size:16px;letter-spacing:.15em;color:var(--indigo)}
.sec-head .meta{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--gray-soft);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;padding:6px 0;border-radius:8px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--indigo);font-weight:700;box-shadow:0 1px 3px rgba(30,30,60,.12)}
.divider-label{font-size:12px;color:var(--sub);letter-spacing:.2em;margin:18px 4px 8px;
  display:flex;align-items:center;gap:10px}
.divider-label::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- ticket card (signature) ---------- */
.tcard{display:flex;background:var(--card);border-radius:14px;margin-bottom:12px;position:relative;
  box-shadow:0 1px 4px rgba(30,30,60,.08);outline:1px solid var(--line);outline-offset:-1px;overflow:hidden;width:100%;border:none;text-align:left;
  font-size:inherit;color:inherit;padding:0}
.tcard:active{transform:scale(.985)}
.tcard .date{width:64px;flex-shrink:0;background:var(--indigo);color:#fff;display:flex;
  flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);
  padding:12px 0;font-variant-numeric:tabular-nums}
.tcard.past .date{background:#9a9aa6}
.tcard .date .m{font-size:11px;opacity:.85;letter-spacing:.1em}
.tcard .date .d{font-size:24px;font-weight:700;line-height:1.15}
.tcard .date .w{font-size:10.5px;opacity:.85}
.tcard .date .y{font-size:9.5px;opacity:.7;letter-spacing:.08em}
/* perforation */
.tcard .body{flex:1;padding:11px 12px 11px 16px;border-left:2px dashed var(--line);position:relative;min-width:0}
.tcard .body::before,.tcard .body::after{content:"";position:absolute;left:-8px;width:14px;height:14px;
  border-radius:50%;background:var(--bg)}
.tcard .body::before{top:-8px}
.tcard .body::after{bottom:-8px}
.tcard .title{font-weight:700;font-size:14.5px;line-height:1.4;padding-right:52px;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tcard .sub{font-size:12px;color:var(--sub);margin-top:2px;padding-right:52px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}

/* ---------- hanko stamp ---------- */
.stamp{position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(-5deg);
  font-family:var(--serif);font-weight:700;font-size:12.5px;text-align:center;
  border:2px solid;border-radius:7px;padding:4px 5px;line-height:1.25;background:rgba(255,255,255,.75)}
.stamp.win{color:var(--shu);border-color:var(--shu)}
.stamp.lose{color:#8b8b96;border-color:#b6b6c0}
.stamp.wait{color:var(--amber);border-color:var(--amber);border-style:dashed}
.stamp.applied{color:var(--blue);border-color:var(--blue)}
.stamp.none{color:#b0b0ba;border-color:#d5d5dd;border-style:dotted}

/* ---------- chips ---------- */
.chip{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--gray-soft);color:var(--sub);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.indigo{background:var(--indigo-soft);color:var(--indigo)}
.chip.shu{background:var(--shu-soft);color:var(--shu)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.chip.pulse{animation:none}}

/* ---------- plain cards (event / cd) ---------- */
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px;
  box-shadow:0 1px 4px rgba(30,30,60,.08);outline:1px solid var(--line);outline-offset:-1px;position:relative;width:100%;border:none;text-align:left;
  font-size:inherit;color:inherit}
.card:active{transform:scale(.985)}
.card .title{font-weight:700;font-size:14.5px;line-height:1.4;padding-right:52px}
.card .line{font-size:12.5px;color:var(--sub);margin-top:2px;padding-right:52px}
.card .line b{color:var(--ink);font-weight:600}
.card .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}

/* ---------- empty state ---------- */
.empty{text-align:center;color:var(--sub);padding:44px 20px;font-size:13.5px;line-height:2}
.empty .glyph{font-family:var(--serif);font-size:30px;color:#c9c9d4;display:block;margin-bottom:6px}

/* ---------- FAB ---------- */
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:29;
  width:54px;height:54px;border-radius:50%;border:none;background:var(--indigo);color:#fff;
  font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(47,58,99,.4);display:flex;
  align-items:center;justify-content:center}
#fab:active{transform:scale(.92)}

/* ---------- modal / sheet ---------- */
#overlay{position:fixed;inset:0;background:rgba(25,25,38,.5);z-index:40;display:none;
  align-items:flex-end;justify-content:center}
#overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - 40px);
  border-radius:20px 20px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{position:sticky;top:0;background:var(--bg);z-index:2;display:flex;align-items:center;
  justify-content:space-between;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sheet-head h3{font-family:var(--serif);font-size:16px;letter-spacing:.12em;color:var(--indigo)}
.sheet-head .x{border:none;background:var(--gray-soft);border-radius:50%;width:30px;height:30px;
  font-size:15px;color:var(--sub)}

/* ---------- forms ---------- */
.fgroup{font-size:11.5px;letter-spacing:.2em;color:var(--sub);margin:20px 2px 8px;
  display:flex;align-items:center;gap:10px}
.fgroup::after{content:"";flex:1;height:1px;background:var(--line)}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);-webkit-appearance:none;appearance:none}
.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--indigo);outline-offset:-1px}
.frow{display:flex;gap:10px}
.frow .field{flex:1;min-width:0}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;
  font-weight:700;margin-top:8px}
.btn.primary{background:var(--indigo);color:#fff}
.btn.danger{background:none;color:var(--shu);font-weight:600;font-size:13.5px}
.btn.ghost{background:var(--card);color:var(--indigo);border:1px solid var(--line)}
.btn:active{opacity:.8}

/* ---------- detail view ---------- */
.dl{background:var(--card);border-radius:14px;padding:4px 14px;margin-bottom:14px;outline:1px solid var(--line);outline-offset:-1px}
.dl .row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);
  font-size:13.5px}
.dl .row:last-child{border-bottom:none}
.dl .row .k{color:var(--sub);flex-shrink:0}
.dl .row .v{text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}
.d-title{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.5;margin:4px 2px 2px}
.d-sub{font-size:12.5px;color:var(--sub);margin:0 2px 12px}
.stamp-inline{display:inline-block;position:static;transform:rotate(-3deg);
  margin-left:8px;vertical-align:middle;padding:3px 8px}

/* ---------- gallery ---------- */
.gal-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px}
.gal-head .t{font-size:12px;letter-spacing:.15em;color:var(--sub)}
.gal-head button{border:1px solid var(--line);background:var(--card);color:var(--indigo);
  border-radius:99px;font-size:12px;padding:4px 12px;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal .th{aspect-ratio:1;border-radius:10px;overflow:hidden;border:none;padding:0;background:var(--gray-soft)}
.gal .th img{width:100%;height:100%;object-fit:cover;display:block}
.gal-empty{font-size:12px;color:#b0b0ba;padding:10px 2px}

/* ---------- image viewer ---------- */
#viewer{position:fixed;inset:0;background:rgba(10,10,16,.96);z-index:60;display:none;
  flex-direction:column}
#viewer.on{display:flex}
#viewer .vbody{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#viewer .vbar{display:flex;justify-content:space-between;padding:14px 18px calc(18px + env(safe-area-inset-bottom))}
#viewer .vbar button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:99px;
  padding:9px 20px;font-size:13.5px}

/* ---------- summary tab ---------- */
.sum-hero{background:linear-gradient(135deg,var(--indigo),var(--indigo2));border-radius:16px;color:#fff;
  padding:20px 18px;margin-bottom:14px;box-shadow:0 3px 10px rgba(47,58,99,.3)}
.sum-hero .lbl{font-size:11px;letter-spacing:.25em;opacity:.8}
.sum-hero .big{font-family:var(--serif);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.3}
.sum-hero .big small{font-size:16px;margin-left:2px}
.sum-hero .note{font-size:10.5px;opacity:.65;margin-top:2px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum-cell{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:0 1px 4px rgba(30,30,60,.08);outline:1px solid var(--line);outline-offset:-1px}
.sum-cell .k{font-size:11px;color:var(--sub);letter-spacing:.1em}
.sum-cell .v{font-family:var(--serif);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--indigo);line-height:1.5}
.sum-cell .v small{font-size:12px}
.sum-cell.shu .v{color:var(--shu)}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px;margin:9px 0}
.bar-row .k{width:74px;color:var(--sub);flex-shrink:0}
.bar-row .bar{flex:1;height:8px;background:var(--gray-soft);border-radius:99px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:var(--indigo);border-radius:99px}
.bar-row .v{width:84px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
.member-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.member-chips .mc{background:var(--indigo-soft);color:var(--indigo);border-radius:99px;
  padding:5px 12px;font-size:13px;display:flex;align-items:center;gap:6px}
.member-chips .mc button{border:none;background:none;color:var(--indigo);font-size:14px;opacity:.6;padding:0}
.inline-add{display:flex;gap:8px;margin-top:8px}
.inline-add input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.inline-add button{border:none;background:var(--indigo);color:#fff;border-radius:10px;padding:0 18px;font-weight:700}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);
  border-radius:12px;padding:4px;outline:1px solid var(--line);outline-offset:-1px}
.month-nav button{width:44px;height:38px;border:none;background:var(--indigo-soft);color:var(--indigo);
  border-radius:9px;font-size:20px;line-height:1}
.month-nav .m-label{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.08em;
  color:var(--indigo);font-variant-numeric:tabular-nums}
.theme-swatches{display:flex;flex-wrap:wrap;gap:12px;margin:12px 2px 6px}
.sw{width:38px;height:38px;border-radius:50%;border:none;padding:0;position:relative;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.sw.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.theme-name{font-size:12px;color:var(--sub);margin:2px 2px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;font-size:13px;padding:9px 20px;border-radius:99px;z-index:70;
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:.94}
</style>
</head>
<body>

<header>
  <h1>推し活まとめ</h1>
  <div id="countdown"></div>
</header>

<main>
  <div class="tab on" id="tab-live"></div>
  <div class="tab" id="tab-event"></div>
  <div class="tab" id="tab-cd"></div>
  <div class="tab" id="tab-sum"></div>
  <div class="tab" id="tab-settings"></div>
</main>

<button id="fab" aria-label="追加">＋</button>

<nav>
  <button data-tab="live" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2.5"/></svg>
    ライブ</button>
  <button data-tab="event">
    <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 1 0-3.6 6.7L21 20l-.9-3.4A8 8 0 0 0 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>
    イベント</button>
  <button data-tab="cd">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/></svg>
    CD</button>
  <button data-tab="sum">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>
    まとめ</button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
    設定</button>
</nav>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<div id="viewer">
  <div class="vbody"><img id="viewer-img" alt="拡大画像"></div>
  <div class="vbar">
    <button id="viewer-del">この画像を削除</button>
    <button id="viewer-close">閉じる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= storage (localStorage + fallback) ================= */
const store=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage;}
catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}};}})();

const KEY='oshikatsu-techo-v1';
const DEFAULT_MEMBERS=['本田康祐','中川勝就','浦野秀太','佐野文哉'];
const THEMES=[
 {name:'ネイビー', bg:'#f3f3f6',primary:'#2f3a63',soft:'#edf0f7',grad:'#465288'},
 {name:'レッド',   bg:'#faf1f1',primary:'#a83240',soft:'#f7e5e7',grad:'#c25563'},
 {name:'ピンク',   bg:'#fbf1f5',primary:'#c04a77',soft:'#f9e4ec',grad:'#d4719a'},
 {name:'オレンジ', bg:'#fbf4ec',primary:'#bf6a2a',soft:'#f8e9db',grad:'#d38a4e'},
 {name:'イエロー', bg:'#fdf8e0',primary:'#dfa400',soft:'#faf0c6',grad:'#f2c94c'},
 {name:'ライトグリーン', bg:'#f3f8e9',primary:'#7a9a2e',soft:'#eaf2d8',grad:'#9ab84f'},
 {name:'グリーン', bg:'#eff6f0',primary:'#3d7a55',soft:'#e2efe6',grad:'#5c9673'},
 {name:'スカイ',   bg:'#edf5fa',primary:'#3379a3',soft:'#e0eef6',grad:'#58a0c6'},
 {name:'ブルー',   bg:'#eef2fa',primary:'#2f55a0',soft:'#e3eaf6',grad:'#5578bd'},
 {name:'パープル', bg:'#f4f0fa',primary:'#6b4aa0',soft:'#ece4f6',grad:'#8c6fbd'},
 {name:'ホワイト', bg:'#ffffff',primary:'#8f8f9c',soft:'#f1f1f5',grad:'#b3b3c0',sw:'#ffffff'},
 {name:'グレー',   bg:'#f2f2f3',primary:'#6e6e78',soft:'#e6e6e9',grad:'#8e8e98'},
 {name:'ブラック', bg:'#f0f0f0',primary:'#2b2b31',soft:'#e4e4e6',grad:'#4a4a52'},
];
let state=loadState();
function loadState(){
  try{const raw=store.getItem(KEY);if(raw){const s=JSON.parse(raw);
    let th=s.theme||'ネイビー';
    if(th==='ビビッドイエロー')th='イエロー';
    if(th==='黄緑')th='ライトグリーン';
    if(!THEMES.some(t=>t.name===th))th='ネイビー';
    return{lives:s.lives||[],events:s.events||[],cds:s.cds||[],members:s.members||DEFAULT_MEMBERS.slice(),
      theme:th};}}
  catch(e){}
  return{lives:[],events:[],cds:[],members:DEFAULT_MEMBERS.slice(),theme:'ネイビー'};
}
function applyTheme(){
  const t=THEMES.find(x=>x.name===state.theme)||THEMES[0];
  const r=document.documentElement.style;
  r.setProperty('--bg',t.bg);r.setProperty('--indigo',t.primary);
  r.setProperty('--indigo-soft',t.soft);r.setProperty('--indigo2',t.grad);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',t.bg);
}
function saveState(){try{store.setItem(KEY,JSON.stringify(state));}catch(e){toast('保存容量が足りません');}}

/* ================= IndexedDB for images (memory fallback) ================= */
const idb={db:null,failed:false,cache:[],
  open(){return new Promise(res=>{if(this.db||this.failed)return res();
    try{const r=indexedDB.open('oshikatsu-img',1);
      r.onupgradeneeded=e=>e.target.result.createObjectStore('imgs',{keyPath:'id'});
      r.onsuccess=e=>{this.db=e.target.result;res();};
      r.onerror=()=>{this.failed=true;res();};
    }catch(e){this.failed=true;res();}});},
  async init(){await this.open();
    if(!this.db){this.cache=this.cache||[];return;}
    this.cache=await new Promise(res=>{const rq=this.db.transaction('imgs').objectStore('imgs').getAll();
      rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>res([]);});},
  async put(rec){await this.open();this.cache.push(rec);
    if(!this.db)return;
    return new Promise(res=>{const t=this.db.transaction('imgs','readwrite');
      t.objectStore('imgs').put(rec);t.oncomplete=res;t.onerror=res;});},
  async del(id){await this.open();this.cache=this.cache.filter(r=>r.id!==id);
    if(!this.db)return;
    return new Promise(res=>{const t=this.db.transaction('imgs','readwrite');
      t.objectStore('imgs').delete(id);t.oncomplete=res;t.onerror=res;});},
  async delByRef(refType,refId){const targets=this.cache.filter(r=>r.refType===refType&&r.refId===refId);
    for(const t of targets)await this.del(t.id);},
  imgs(refType,refId,kind){return this.cache.filter(r=>r.refType===refType&&r.refId===refId&&(!kind||r.kind===kind));},
  async clearAll(){const all=this.cache.slice();for(const r of all)await this.del(r.id);}
};

/* ================= utils ================= */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['日','月','火','水','木','金','土'];
function pd(str){if(!str)return null;const d=new Date(str+(str.length===10?'T00:00':''));return isNaN(d)?null:d;}
function fmtDate(str){const d=pd(str);if(!d)return '';
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}(${WD[d.getDay()]})`;}
function fmtDT(str){const d=pd(str);if(!d)return '';
  return fmtDate(str)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function yen(n){n=Number(n)||0;return '¥'+n.toLocaleString('ja-JP');}
function daysUntil(str){const d=pd(str);if(!d)return null;
  const t=new Date();t.setHours(0,0,0,0);const dd=new Date(d);dd.setHours(0,0,0,0);
  return Math.round((dd-t)/86400000);}
function isPast(str){const n=daysUntil(str);return n!==null&&n<0;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('on'),2200);}

const stampCls={'当選':'win','落選':'lose','結果待ち':'wait','申込済':'applied','未申込':'none'};

/* ================= official event master (owv-events.json) ================= */
let MASTER={lives:[],events:[],cds:[]};
async function loadMaster(){
  try{const res=await fetch('owv-events.json',{cache:'no-store'});
    if(!res.ok)return;
    const j=await res.json();
    MASTER={lives:j.lives||[],events:j.events||[],cds:j.cds||[]};
  }catch(e){/* file直開きなど、取得できない環境では手入力のみ */}
}
function masterPicker(kind){
  const list=MASTER[kind];
  if(!list||!list.length)return '';
  const label=m=>kind==='cds'?`${m.title}（${m.version||''}）`:(kind==='events'?`${(m.date||'').slice(5).replace('-','/')} ${m.title}`:m.title);
  return `<div class="field"><label>公式データから選ぶ（選ぶと自動入力されます）</label>
    <select id="f-master"><option value="">― 手入力する ―</option>
    ${list.map((m,i)=>`<option value="${i}">${esc(label(m))}</option>`).join('')}</select></div>`;
}
function bindMaster(kind,fill){
  const mp=document.getElementById('f-master');
  if(mp)mp.addEventListener('change',()=>{
    const m=MASTER[kind][Number(mp.value)];if(!m)return;fill(m);toast('自動入力しました');});
}

/* ================= header countdown ================= */
function renderCountdown(){
  const cand=[];
  state.lives.forEach(l=>{if(l.date&&!isPast(l.date))cand.push({d:l.date,t:l.title,k:'LIVE'});});
  state.events.forEach(ev=>{if(ev.date&&!isPast(ev.date))cand.push({d:ev.date,t:ev.title,k:'EVENT'});});
  cand.sort((a,b)=>a.d<b.d?-1:1);
  const el=document.getElementById('countdown');
  if(!cand.length){el.innerHTML='<span style="opacity:.6">次の予定はまだありません</span>';return;}
  const n=cand[0];const days=daysUntil(n.d);
  const nm=n.t.length>13?n.t.slice(0,13)+'…':n.t;
  el.innerHTML=`${esc(nm)}<br>${days===0?'<span class="num">本日</span>':`あと <span class="num">${days}</span> 日`}`;
}

/* ================= image handling ================= */
function compressFile(file){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();
    img.onload=()=>{const max=1280;let w=img.width,h=img.height;
      const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',0.72));};
    img.onerror=rej;img.src=fr.result;};
  fr.onerror=rej;fr.readAsDataURL(file);});}

function pickImages(refType,refId,kind,after){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.addEventListener('change',async()=>{
    if(!inp.files.length)return;toast('画像を保存しています…');
    for(const f of inp.files){
      try{const data=await compressFile(f);
        await idb.put({id:uid(),refType,refId,kind,data,created:Date.now()});}
      catch(e){toast('画像の読み込みに失敗しました');}
    }
    toast('画像を保存しました');after&&after();
  });
  inp.click();
}
function galleryHTML(refType,refId,kind,label){
  const imgs=idb.imgs(refType,refId,kind);
  return `<div class="gal-head"><span class="t">${esc(label)}（${imgs.length}）</span>
    <button data-pick="${kind}">＋ 追加</button></div>
    ${imgs.length?`<div class="gal">${imgs.map(r=>
      `<button class="th" data-view="${r.id}"><img src="${r.data}" alt=""></button>`).join('')}</div>`
      :`<div class="gal-empty">まだ画像がありません</div>`}`;
}
/* viewer */
const viewer=document.getElementById('viewer');let viewerId=null,viewerAfter=null;
function openViewer(id,after){const rec=idb.cache.find(r=>r.id===id);if(!rec)return;
  viewerId=id;viewerAfter=after;document.getElementById('viewer-img').src=rec.data;viewer.classList.add('on');}
document.getElementById('viewer-close').addEventListener('click',()=>viewer.classList.remove('on'));
document.getElementById('viewer-del').addEventListener('click',async()=>{
  if(viewerId&&confirm('この画像を削除しますか?')){await idb.del(viewerId);viewer.classList.remove('on');
    toast('画像を削除しました');viewerAfter&&viewerAfter();}});
function bindGallery(refType,refId,after){
  sheet.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',
    ()=>pickImages(refType,refId,b.dataset.pick,after)));
  sheet.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',
    ()=>openViewer(b.dataset.view,after)));
}

/* ================= LIVE tab ================= */
let liveFilter='upcoming';
function renderLives(){
  const root=document.getElementById('tab-live');
  const lives=state.lives.slice().sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);
  const up=lives.filter(l=>!isPast(l.date));
  const past=lives.filter(l=>isPast(l.date)).reverse();
  let list=liveFilter==='upcoming'?up:liveFilter==='past'?past:null;
  let inner=`<div class="sec-head"><h2>ライブ・ツアー</h2><span class="meta">全${state.lives.length}件</span></div>
  <div class="seg">
    <button data-f="upcoming" class="${liveFilter==='upcoming'?'on':''}">今後 (${up.length})</button>
    <button data-f="past" class="${liveFilter==='past'?'on':''}">過去 (${past.length})</button>
    <button data-f="all" class="${liveFilter==='all'?'on':''}">すべて</button>
  </div>`;
  const cardOf=l=>{
    const d=pd(l.date);const days=daysUntil(l.date);
    const chips=[];
    if(days!==null&&days>=0&&days<=30)chips.push(`<span class="chip shu">${days===0?'本日!':'あと'+days+'日'}</span>`);
    if(l.tour)chips.push(`<span class="chip indigo">${esc(l.tour)}</span>`);
    if(l.transport&&l.transport!=='なし')chips.push(`<span class="chip">${esc(l.transport)}</span>`);
    if(l.stay==='あり')chips.push(`<span class="chip blue">宿泊</span>`);
    const nTicket=idb.imgs('live',l.id,'ticket').length,nPhoto=idb.imgs('live',l.id,'photo').length;
    if(nTicket)chips.push(`<span class="chip green">🎫${nTicket}</span>`);
    if(nPhoto)chips.push(`<span class="chip amber">📷${nPhoto}</span>`);
    return `<button class="tcard ${isPast(l.date)?'past':''}" data-open="${l.id}">
      <span class="date">${d?`<span class="y">${d.getFullYear()}</span><span class="m">${d.getMonth()+1}月</span><span class="d">${d.getDate()}</span><span class="w">${WD[d.getDay()]}</span>`:'<span class="m">日付</span><span class="d">-</span>'}</span>
      <span class="body">
        <span class="title">${esc(l.title)}</span>
        <span class="sub">${esc(l.venue||'会場未定')}${l.time?'・'+esc(l.time)+'〜':''}</span>
        <span class="chips">${chips.join('')}</span>
        ${stampHTML(l.status)}
      </span></button>`;
  };
  if(list){
    inner+=list.length?list.map(cardOf).join(''):
      `<div class="empty"><span class="glyph">✦</span>${liveFilter==='upcoming'?'今後のライブ予定はありません<br>右下の＋から追加できます':'過去のライブ記録はありません'}</div>`;
  }else{
    inner+=up.length?`<div class="divider-label">今後の予定</div>`+up.map(cardOf).join(''):'';
    inner+=past.length?`<div class="divider-label">過去の記録</div>`+past.map(cardOf).join(''):'';
    if(!lives.length)inner+=`<div class="empty"><span class="glyph">✦</span>まだ登録がありません<br>右下の＋から追加できます</div>`;
  }
  root.innerHTML=inner;
  root.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{liveFilter=b.dataset.f;renderLives();}));
  root.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openLiveDetail(b.dataset.open)));
}

  const up=evs.filter(e=>!isPast(e.date));

      <span class="chips">${chips.join('')}</span>
      ${stampHTML(ev.status)}</button>`;
  };
  if(list){inner+=list.length?list.map(cardOf).join(''):
    `<div class="empty"><span class="glyph">✦</span>${eventFilter==='upcoming'?'今後のイベント予定はありません<br>右下の＋から追加できます':'過去のイベント記録はありません'}</div>`;}
  else{
    inner+=up.length?`<div class="divider-label">今後の予定</div>`+up.map(cardOf).join(''):'';
    inner+=past.length?`<div class="divider-label">過去の記録</div>`+past.map(cardOf).join(''):'';
    if(!evs.length)inner+=`<div class="empty"><span class="glyph">✦</span>まだ登録がありません</div>`;
  }
  root.innerHTML=inner;
  root.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{eventFilter=b.dataset.f;renderEvents();}));
  root.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openEventDetail(b.dataset.open)));
}

  const cds=state.cds.slice().sort((a,b)=>(b.releaseDate||'')<(a.releaseDate||'')?-1:1).reverse();
  const totalQty=state.cds.reduce((s,c)=>s+(Number(c.qty)||0),0);
  const totalCost=state.cds.reduce((s,c)=>s+(Number(c.qty)||0)*(Number(c.price)||0),0);
  let inner=`<div class="sec-head"><h2>CD・購入管理</h2><span class="meta">計${totalQty}枚 / ${yen(totalCost)}</span></div>`;
  if(!cds.length)inner+=`<div class="empty"><span class="glyph">✦</span>まだ登録がありません<br>右下の＋から追加できます</div>`;
  inner+=cds.map(c=>{

    if(c.version)chips.push(`<span class="chip indigo">${esc(c.version)}</span>`);
    if(c.store)chips.push(`<span class="chip">${esc(c.store)}</span>`);
    if(c.serial)chips.push(`<span class="chip shu">リリイベ対象</span>`);
    const bonus=(c.bonus||'').replace(/\n/g,'、');

      <span class="line">${c.releaseDate?fmtDate(c.releaseDate)+'発売　':''}<b>${qty}枚</b>${price?'　'+yen(qty*price):''}</span>
      ${bonus?`<span class="line" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">特典: ${esc(bonus)}</span>`:''}

/* ================= SUMMARY tab ================= */
function monthCosts(ym){
  /* ym: 'YYYY-MM' または null(全期間) */
  const inM=d=>!ym||( (d||'').slice(0,7)===ym );
  const won=state.lives.filter(l=>l.status==='当選'&&inM(l.date));
  const ticket=won.reduce((s,l)=>s+(Number(l.price)||0),0);
  const travel=won.reduce((s,l)=>s+(Number(l.transCost)||0)+(Number(l.stayCost)||0),0);
  const cd=state.cds.filter(c=>inM(c.buyDate||c.releaseDate))
    .reduce((s,c)=>s+(Number(c.qty)||0)*(Number(c.price)||0),0);
  const ev=state.events.filter(e=>inM(e.date)).reduce((s,e)=>s+(Number(e.cost)||0),0);
  return{ticket,travel,cd,ev,total:ticket+travel+cd+ev};
}
let sumMonth=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');})();
function shiftMonth(ym,diff){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+diff,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymLabel(ym){const[y,m]=ym.split('-');return `${y}年${Number(m)}月`;}

function renderSummary(){
  const root=document.getElementById('tab-sum');
  const mc=monthCosts(sumMonth);
  const all=monthCosts(null);
  const allApps=[...state.lives,...state.events];
  const nWin=allApps.filter(x=>x.status==='当選').length;
  const nLose=allApps.filter(x=>x.status==='落選').length;
  const rate=(nWin+nLose)?Math.round(nWin/(nWin+nLose)*100):null;
  const totalQty=state.cds.reduce((s,c)=>s+(Number(c.qty)||0),0);
  const wonAll=state.lives.filter(l=>l.status==='当選');
  const trips=wonAll.filter(l=>l.stay==='あり'||['新幹線','飛行機','高速バス'].includes(l.transport)).length;
  const maxCat=Math.max(mc.ticket,mc.travel,mc.cd,mc.ev,1);
  const bar=(k,v)=>`<div class="bar-row"><span class="k">${k}</span><span class="bar"><i style="width:${Math.round(v/maxCat*100)}%"></i></span><span class="v">${yen(v)}</span></div>`;
  const upcoming=[];
  state.lives.forEach(l=>{if(l.date&&!isPast(l.date))upcoming.push({d:l.date,label:l.title});});
  state.events.forEach(e=>{if(e.date&&!isPast(e.date))upcoming.push({d:e.date,label:e.title});});
  upcoming.sort((a,b)=>a.d<b.d?-1:1);
  root.innerHTML=`
  <div class="sec-head"><h2>まとめ</h2></div>
  <div class="month-nav">
    <button id="m-prev" aria-label="前の月">‹</button>
    <span class="m-label">${ymLabel(sumMonth)}</span>
    <button id="m-next" aria-label="次の月">›</button>
  </div>
  <div class="dl" style="padding:12px 14px;margin-top:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
      <span style="font-size:12px;letter-spacing:.15em;color:var(--sub)">${ymLabel(sumMonth)}の支出</span>
      <span style="font-family:var(--serif);font-size:22px;font-weight:700;color:var(--indigo);font-variant-numeric:tabular-nums">${yen(mc.total)}</span>
    </div>
    ${bar('チケット',mc.ticket)}${bar('交通・宿泊',mc.travel)}${bar('CD',mc.cd)}${bar('イベント',mc.ev)}
  </div>
  <div class="sum-grid">
    <div class="sum-cell shu"><div class="k">当選率</div><div class="v">${rate===null?'―':rate+'<small> %</small>'}</div>
      <div class="k" style="margin-top:2px">当選${nWin} / 落選${nLose}</div></div>
    <div class="sum-cell"><div class="k">積みCD</div><div class="v">${totalQty}<small> 枚</small></div>
      <div class="k" style="margin-top:2px">${yen(all.cd)}</div></div>
    <div class="sum-cell"><div class="k">遠征回数</div><div class="v">${trips}<small> 回</small></div>
      <div class="k" style="margin-top:2px">交通・宿泊 ${yen(all.travel)}</div></div>
    <div class="sum-cell"><div class="k">今後の予定</div><div class="v">${upcoming.length}<small> 件</small></div>
      <div class="k" style="margin-top:2px">${upcoming[0]?esc(upcoming[0].d.slice(5).replace('-','/'))+' '+esc(upcoming[0].label.slice(0,8)):'なし'}</div></div>
  </div>
  <div class="dl" style="padding:11px 14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-size:12.5px;color:var(--sub)">推し活総支出（全期間）</span>
      <span style="font-size:16px;font-weight:700;font-variant-numeric:tabular-nums">${yen(all.total)}</span>
    </div>
    <div style="font-size:10.5px;color:var(--sub);margin-top:2px">※ チケット・遠征費は「当選」した公演のみ集計しています</div>
  </div>
  <div style="height:20px"></div>`;
  document.getElementById('m-prev').addEventListener('click',()=>{sumMonth=shiftMonth(sumMonth,-1);renderSummary();});
  document.getElementById('m-next').addEventListener('click',()=>{sumMonth=shiftMonth(sumMonth,1);renderSummary();});
}

  root.innerHTML=`
  <div class="sec-head"><h2>設定</h2></div>
  <div class="fgroup">テーマカラー（推し色に変えられます）</div>
  <div class="theme-swatches">${THEMES.map(t=>

    `<span class="mc">${esc(m)}<button data-rm="${i}" aria-label="削除">✕</button></span>`).join('')||'<span style="font-size:12px;color:var(--sub)">未登録</span>'}</div>

  <button class="btn ghost" id="btn-export">データを書き出す（JSON）</button>
  <button class="btn ghost" id="btn-import">データを読み込む</button>
  <div style="font-size:11px;color:var(--sub);margin-top:8px;line-height:1.8">
    データはこの端末のブラウザ内に保存されます。機種変更やブラウザ変更の前に書き出しでバックアップしてください（画像も含まれます）。</div>
  <div class="fgroup">データの初期化</div>
  <button class="btn danger" id="btn-reset" style="border:1px solid var(--shu);border-radius:12px">全てのデータを削除</button>
  <div style="font-size:11px;color:var(--sub);margin-top:8px;line-height:1.8">
    ライブ・イベント・CD・画像・メンバー登録・テーマを全て削除して初期状態に戻します。この操作は取り消せません。</div>
  <div style="height:20px"></div>`;
  root.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{
    state.theme=b.dataset.theme;saveState();applyTheme();renderSettings();}));
  root.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{

  document.getElementById('add-member').addEventListener('click',()=>{
    const v=document.getElementById('new-member').value.trim();
    if(v&&!state.members.includes(v)){state.members.push(v);saveState();renderSettings();}});
  document.getElementById('btn-export').addEventListener('click',exportData);
  document.getElementById('btn-import').addEventListener('click',importData);
  document.getElementById('btn-reset').addEventListener('click',async()=>{
    if(!confirm('全てのデータ（ライブ・イベント・CD・画像・設定）を削除します。よろしいですか?'))return;
    if(!confirm('本当に削除しますか?　この操作は取り消せません。\n必要ならキャンセルして、先に「データを書き出す」でバックアップしてください。'))return;
    await idb.clearAll();
    state={lives:[],events:[],cds:[],members:DEFAULT_MEMBERS.slice(),theme:'ネイビー'};
    try{store.removeItem(KEY);}catch(e){}
    saveState();applyTheme();render();toast('全てのデータを削除しました');
  });
}

async function exportData(){
  const payload={app:'oshikatsu-techo',version:1,exported:new Date().toISOString(),
    state,images:idb.cache};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='推し活まとめ_backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  toast('書き出しました');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.addEventListener('change',()=>{
    const f=inp.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=async()=>{
      try{const p=JSON.parse(fr.result);
        if(p.app!=='oshikatsu-techo')throw 0;
        if(!confirm('現在のデータを読み込んだ内容で置き換えます。よろしいですか?'))return;
        state={lives:p.state.lives||[],events:p.state.events||[],cds:p.state.cds||[],
          members:p.state.members||DEFAULT_MEMBERS.slice(),theme:p.state.theme||'ネイビー'};
        saveState();applyTheme();
        await idb.clearAll();
        for(const r of (p.images||[]))await idb.put(r);
        render();toast('読み込みました');
      }catch(e){toast('ファイルの形式が正しくありません');}
    };
    fr.readAsText(f);
  });
  inp.click();
}

/* ================= boot ================= */
function render(){renderCountdown();
  if(activeTab==='live')renderLives();
  else if(activeTab==='event')renderEvents();
  else if(activeTab==='cd')renderCDs();
  else if(activeTab==='settings')renderSettings();
  else renderSummary();}
(async()=>{applyTheme();loadMaster();await idb.init();renderLives();renderCountdown();})();
</script>
